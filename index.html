<!DOCTYPE html>

<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Chat Diary</title>




<style>

* {

    box-sizing: border-box;

}




body {

    margin: 0;

    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display",

                 "Apple SD Gothic Neo", sans-serif;

    background: #ffffff;

    color: #111;

    overflow: hidden;

}




button,

input,

textarea {

    font: inherit;

}




.app {

    width: 100vw;

    height: 100vh;

    display: flex;

    flex-direction: column;

    position: relative;

}




.background {

    position: fixed;

    inset: 0;

    z-index: -2;

    background: white;

    overflow: hidden;

}




.background img {

    position: absolute;

    width: 100%;

    height: 100%;

    object-fit: cover;

    transform-origin: center;

    user-select: none;

    pointer-events: none;

}




.background-overlay {

    position: absolute;

    inset: 0;

    z-index: -1;

}




/* 상단 */




.header {

    padding: 12px 16px 8px;

    background: rgba(255,255,255,0.82);

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(20px);

    border-bottom: 1px solid rgba(0,0,0,0.08);

}




.title {

    text-align: center;

    font-size: 17px;

    font-weight: 600;

    margin-bottom: 10px;

}




.search {

    width: 100%;

    height: 40px;

    border: none;

    outline: none;

    border-radius: 20px;

    padding: 0 16px;

    background: #f0f0f2;

    color: #111;

}




.search::placeholder {

    color: #777;

}




/* 채팅 */




.messages {

    flex: 1;

    overflow-y: auto;

    padding: 14px 14px 10px;

    scroll-behavior: smooth;

}




.message-wrapper {

    display: flex;

    justify-content: flex-end;

    margin-bottom: 12px;

}




.message-content {

    max-width: min(78%, 360px);

    display: flex;

    flex-direction: column;

    align-items: flex-end;

}




.date-divider {

    display: flex;

    align-items: center;

    gap: 10px;

    margin: 18px 0;

    color: #666;

    font-size: 12px;

}




.date-divider::before,

.date-divider::after {

    content: "";

    height: 1px;

    background: rgba(0,0,0,0.18);

    flex: 1;

}




.date-label {

    padding: 5px 10px;

    border-radius: 20px;

    background: rgba(255,255,255,0.75);

    backdrop-filter: blur(10px);

    white-space: nowrap;

}




.bubble {

    color: white;

    background: #111;

    border-radius: 18px;

    padding: 10px 14px;

    line-height: 1.45;

    word-break: break-word;

}




.photo {

    max-width: 260px;

    max-height: 340px;

    border-radius: 18px;

    object-fit: contain;

    display: block;

    margin-bottom: 4px;

}




.tags {

    margin-top: 4px;

    font-size: 11px;

    color: #777;

}




.time {

    margin-top: 3px;

    font-size: 10px;

    color: #888;

}




/* 입력창 */




.input-area {

    display: flex;

    align-items: flex-end;

    gap: 8px;

    padding: 8px 12px calc(8px + env(safe-area-inset-bottom));

    background: rgba(255,255,255,0.88);

    backdrop-filter: blur(20px);

    -webkit-backdrop-filter: blur(20px);

    border-top: 1px solid rgba(0,0,0,0.08);

}




.icon-button {

    width: 40px;

    height: 40px;

    border: none;

    background: transparent;

    cursor: pointer;

    font-size: 21px;

}




.input {

    flex: 1;

    min-height: 40px;

    max-height: 120px;

    resize: none;

    border: none;

    outline: none;

    border-radius: 20px;

    padding: 10px 14px;

    background: #f0f0f2;

    color: #111;

}




.send {

    width: 40px;

    height: 40px;

    border: none;

    background: transparent;

    font-size: 28px;

    cursor: pointer;

}




.send:disabled {

    opacity: 0.3;

}




.hidden {

    display: none;

}




/* 설정 패널 */




.settings {

    position: fixed;

    inset: 0;

    background: rgba(0,0,0,0.35);

    backdrop-filter: blur(8px);

    display: none;

    align-items: flex-end;

    z-index: 20;

}




.settings.open {

    display: flex;

}




.settings-panel {

    width: 100%;

    max-height: 80vh;

    overflow-y: auto;

    background: white;

    border-radius: 24px 24px 0 0;

    padding: 20px;

}




.settings-title {

    font-size: 20px;

    font-weight: 700;

    margin-bottom: 20px;

}




.setting-row {

    display: flex;

    align-items: center;

    justify-content: space-between;

    padding: 15px 0;

    border-bottom: 1px solid #eee;

}




.setting-row input[type="color"] {

    width: 45px;

    height: 32px;

    border: none;

    background: none;

}




.close-settings {

    width: 100%;

    border: none;

    background: #eee;

    border-radius: 14px;

    padding: 13px;

    margin-top: 20px;

}




/* 배경 조정 */




.crop {

    position: fixed;

    inset: 0;

    background: #000;

    display: none;

    z-index: 30;

    overflow: hidden;

}




.crop.open {

    display: block;

}




.crop img {

    position: absolute;

    width: 100%;

    height: 100%;

    object-fit: cover;

    transform-origin: center;

    user-select: none;

}




.crop-top {

    position: absolute;

    top: 20px;

    left: 0;

    right: 0;

    display: flex;

    justify-content: space-between;

    padding: 0 18px;

    z-index: 2;

}




.crop-top button {

    border: none;

    border-radius: 18px;

    padding: 8px 14px;

    background: rgba(255,255,255,0.8);

}




.crop-help {

    position: absolute;

    bottom: 30px;

    left: 0;

    right: 0;

    text-align: center;

    color: white;

    font-size: 13px;

}




/* 하단 네비 */




.nav {

    height: 54px;

    display: flex;

    background: rgba(255,255,255,0.9);

    backdrop-filter: blur(20px);

    border-top: 1px solid rgba(0,0,0,0.08);

}




.nav button {

    flex: 1;

    border: none;

    background: transparent;

    color: #777;

}




.nav button.active {

    color: #111;

    font-weight: 600;

}

</style>

</head>




<body>




<div class="app">




    <div class="background" id="background">

        <img id="backgroundImage">

        <div class="background-overlay"></div>

    </div>




    <header class="header">

        <div class="title">Diary</div>




        <input

            id="search"

            class="search"

            type="search"

            placeholder="일기 검색"

        >

    </header>




    <main id="messages" class="messages"></main>




    <div class="input-area">




        <button

            id="photoButton"

            class="icon-button"

            title="사진"

        >＋</button>




        <input

            id="photoInput"

            class="hidden"

            type="file"

            accept="image/*"

        >




        <textarea

            id="input"

            class="input"

            rows="1"

            placeholder="오늘의 이야기를 적어보세요"

        ></textarea>




        <button

            id="send"

            class="send"

            disabled

        >↑</button>




    </div>




    <nav class="nav">

        <button class="active" id="diaryTab">Diary</button>

        <button id="settingsTab">Settings</button>

    </nav>




</div>







<!-- 설정 -->




<div id="settings" class="settings">




    <div class="settings-panel">




        <div class="settings-title">

            Display

        </div>




        <div class="setting-row">

            <span>배경 색상</span>

            <input

                type="color"

                id="backgroundColor"

                value="#ffffff"

            >

        </div>




        <div class="setting-row">

            <span>말풍선 색상</span>

            <input

                type="color"

                id="bubbleColor"

                value="#111111"

            >

        </div>




        <div class="setting-row">

            <span>배경 사진</span>

            <input

                type="file"

                id="backgroundInput"

                accept="image/*"

            >

        </div>




        <div class="setting-row">

            <span>배경 사진 위치</span>

            <button id="cropButton">

                조정

            </button>

        </div>




        <div class="setting-row">

            <span>배경 사진 제거</span>

            <button id="removeBackground">

                제거

            </button>

        </div>




        <button

            class="close-settings"

            id="closeSettings"

        >

            닫기

        </button>




    </div>

</div>







<!-- 배경 조정 -->




<div id="crop" class="crop">




    <div class="crop-top">

        <button id="cancelCrop">

            취소

        </button>




        <button id="saveCrop">

            완료

        </button>

    </div>




    <img id="cropImage">




    <div class="crop-help">

        드래그해서 이동 · 두 손가락으로 확대/축소

    </div>




</div>







<script>




const STORAGE_KEY = "chat_diary_messages";

const SETTINGS_KEY = "chat_diary_settings";




let messages =

    JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");




let settings =

    JSON.parse(localStorage.getItem(SETTINGS_KEY) || "{}");




let scale = settings.scale || 1;

let offsetX = settings.offsetX || 0;

let offsetY = settings.offsetY || 0;




const messagesEl =

    document.getElementById("messages");




const input =

    document.getElementById("input");




const send =

    document.getElementById("send");




const search =

    document.getElementById("search");




const background =

    document.getElementById("background");




const backgroundImage =

    document.getElementById("backgroundImage");




const bubbleColor =

    document.getElementById("bubbleColor");




const backgroundColor =

    document.getElementById("backgroundColor");




const settingsEl =

    document.getElementById("settings");




const cropEl =

    document.getElementById("crop");




const cropImage =

    document.getElementById("cropImage");




let currentCropScale = scale;

let currentCropX = offsetX;

let currentCropY = offsetY;




let dragStartX = 0;

let dragStartY = 0;




let dragging = false;







/* 저장 */




function saveMessages() {

    localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify(messages)

    );

}




function saveSettings() {




    settings.scale = scale;

    settings.offsetX = offsetX;

    settings.offsetY = offsetY;




    localStorage.setItem(

        SETTINGS_KEY,

        JSON.stringify(settings)

    );

}







/* 시간 */




function formatTime(date) {




    return new Date(date)

        .toLocaleTimeString(

            "ko-KR",

            {

                hour: "numeric",

                minute: "2-digit"

            }

        );

}







/* 날짜 */




function dateString(date) {




    const d = new Date(date);




    return `${d.getFullYear()}.${String(

        d.getMonth() + 1

    ).padStart(2,"0")}.${String(

        d.getDate()

    ).padStart(2,"0")}`;

}







/* 렌더링 */




function renderMessages() {




    const keyword =

        search.value.trim().toLowerCase();




    messagesEl.innerHTML = "";




    let previousDate = "";




    messages

        .filter(message => {




            if (!keyword)

                return true;




            return message.text

                .toLowerCase()

                .includes(keyword);




        })

        .forEach(message => {




            const date =

                dateString(message.date);




            if (date !== previousDate) {




                const divider =

                    document.createElement("div");




                divider.className =

                    "date-divider";




                divider.innerHTML =

                    `<span class="date-label">${date}</span>`;




                messagesEl.appendChild(divider);




                previousDate = date;

            }




            const wrapper =

                document.createElement("div");




            wrapper.className =

                "message-wrapper";




            const content =

                document.createElement("div");




            content.className =

                "message-content";







            /* 사진 */




            if (message.image) {




                const img =

                    document.createElement("img");




                img.className =

                    "photo";




                img.src =

                    message.image;




                content.appendChild(img);

            }







            /* 텍스트 */




            if (message.text) {




                const bubble =

                    document.createElement("div");




                bubble.className =

                    "bubble";




                bubble.style.background =

                    settings.bubbleColor || "#111111";




                bubble.textContent =

                    message.text;




                content.appendChild(bubble);

            }







            /* 시간 */




            const time =

                document.createElement("div");




            time.className =

                "time";




            time.textContent =

                formatTime(message.date);




            content.appendChild(time);




            wrapper.appendChild(content);




            messagesEl.appendChild(wrapper);

        });




    messagesEl.scrollTop =

        messagesEl.scrollHeight;

}







/* 글 전송 */




function sendMessage() {




    const text =

        input.value.trim();




    if (!text)

        return;




    messages.push({

        id: crypto.randomUUID(),

        text: text,

        image: null,

        date: new Date().toISOString()

    });




    saveMessages();




    input.value = "";




    input.style.height = "40px";




    send.disabled = true;




    renderMessages();




    /*

     * 모바일 웹에서도 키보드가 내려가도록

     */

    input.blur();

}




send.addEventListener(

    "click",

    sendMessage

);







/* Enter */




input.addEventListener(

    "keydown",

    event => {




        if (

            event.key === "Enter" &&

            !event.shiftKey

        ) {




            event.preventDefault();




            sendMessage();

        }

    }

);







/* 입력창 자동 높이 */




input.addEventListener(

    "input",

    () => {




        input.style.height =

            "auto";




        input.style.height =

            Math.min(

                input.scrollHeight,

                120

            ) + "px";




        send.disabled =

            !input.value.trim();

    }

);







/* 검색 */




search.addEventListener(

    "input",

    renderMessages

);







/* 사진 전송 */




document

    .getElementById("photoButton")

    .addEventListener(

        "click",

        () => {




            document

                .getElementById("photoInput")

                .click();

        }

    );







document

    .getElementById("photoInput")

    .addEventListener(

        "change",

        event => {




            const file =

                event.target.files[0];




            if (!file)

                return;




            const reader =

                new FileReader();




            reader.onload =

                () => {




                    messages.push({




                        id:

                            crypto.randomUUID(),




                        text:

                            "",




                        image:

                            reader.result,




                        date:

                            new Date().toISOString()

                    });




                    saveMessages();




                    renderMessages();

                };




            reader.readAsDataURL(file);




            event.target.value = "";

        }

    );







/* 설정 열기 */




document

    .getElementById("settingsTab")

    .addEventListener(

        "click",

        () => {




            settingsEl.classList.add(

                "open"

            );

        }

    );







/* 설정 닫기 */




document

    .getElementById("closeSettings")

    .addEventListener(

        "click",

        () => {




            settingsEl.classList.remove(

                "open"

            );

        }

    );







/* 배경 색상 */




backgroundColor.value =

    settings.backgroundColor || "#ffffff";




backgroundColor.addEventListener(

    "input",

    () => {




        settings.backgroundColor =

            backgroundColor.value;




        background.style.background =

            backgroundColor.value;




        saveSettings();

    }

);







/* 말풍선 색 */




bubbleColor.value =

    settings.bubbleColor || "#111111";




bubbleColor.addEventListener(

    "input",

    () => {




        settings.bubbleColor =

            bubbleColor.value;




        saveSettings();




        renderMessages();

    }

);







/* 배경 적용 */




function applyBackground() {




    background.style.background =

        settings.backgroundColor ||

        "#ffffff";




    if (settings.backgroundImage) {




        backgroundImage.src =

            settings.backgroundImage;




        backgroundImage.style.transform =

            `translate(${offsetX}px, ${offsetY}px)

             scale(${scale})`;




    } else {




        backgroundImage.removeAttribute(

            "src"

        );

    }

}




applyBackground();







/* 배경 사진 선택 */




document

    .getElementById("backgroundInput")

    .addEventListener(

        "change",

        event => {




            const file =

                event.target.files[0];




            if (!file)

                return;




            const reader =

                new FileReader();




            reader.onload =

                () => {




                    settings.backgroundImage =

                        reader.result;




                    scale = 1;

                    offsetX = 0;

                    offsetY = 0;




                    saveSettings();




                    applyBackground();

                };




            reader.readAsDataURL(file);

        }

    );







/* 배경 제거 */




document

    .getElementById("removeBackground")

    .addEventListener(

        "click",

        () => {




            settings.backgroundImage =

                null;




            scale = 1;

            offsetX = 0;

            offsetY = 0;




            saveSettings();




            applyBackground();

        }

    );







/* 배경 조정 */




document

    .getElementById("cropButton")

    .addEventListener(

        "click",

        () => {




            if (!settings.backgroundImage)

                return;




            cropImage.src =

                settings.backgroundImage;




            currentCropScale =

                scale;




            currentCropX =

                offsetX;




            currentCropY =

                offsetY;




            updateCrop();




            cropEl.classList.add(

                "open"

            );

        }

    );







function updateCrop() {




    cropImage.style.transform =

        `translate(${currentCropX}px, ${currentCropY}px)

         scale(${currentCropScale})`;

}







/* 배경 드래그 */




cropImage.addEventListener(

    "pointerdown",

    event => {




        dragging = true;




        dragStartX =

            event.clientX -

            currentCropX;




        dragStartY =

            event.clientY -

            currentCropY;




        cropImage.setPointerCapture(

            event.pointerId

        );

    }

);







cropImage.addEventListener(

    "pointermove",

    event => {




        if (!dragging)

            return;




        currentCropX =

            event.clientX -

            dragStartX;




        currentCropY =

            event.clientY -

            dragStartY;




        updateCrop();

    }

);







cropImage.addEventListener(

    "pointerup",

    () => {




        dragging = false;

    }

);







/* 마우스 휠 확대/축소 */




cropImage.addEventListener(

    "wheel",

    event => {




        event.preventDefault();




        if (event.deltaY < 0) {




            currentCropScale =

                Math.min(

                    5,

                    currentCropScale + 0.1

                );




        } else {




            currentCropScale =

                Math.max(

                    1,

                    currentCropScale - 0.1

                );

        }




        updateCrop();

    },

    { passive: false }

);







/* 배경 조정 취소 */




document

    .getElementById("cancelCrop")

    .addEventListener(

        "click",

        () => {




            cropEl.classList.remove(

                "open"

            );

        }

    );







/* 배경 조정 저장 */




document

    .getElementById("saveCrop")

    .addEventListener(

        "click",

        () => {




            scale =

                currentCropScale;




            offsetX =

                currentCropX;




            offsetY =

                currentCropY;




            saveSettings();




            applyBackground();




            cropEl.classList.remove(

                "open"

            );

        }

    );







/* 초기 화면 */




renderMessages();




</script>




</body>

</html>
